version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: regtech_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: regtech_api
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    depends_on:
      - qdrant

  ui:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: regtech_ui
    command: streamlit run src/ui/dashboard.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - API_URL=http://api:8000
    depends_on:
      - api

volumes:
  qdrant_storage: